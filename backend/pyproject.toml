[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["database: integration tests requiring a disposable PostgreSQL database"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
